name: Deploy Hockey Branch to Hostpoint

on:
  push:
    branches:
      - hockey   # triggers when pushing to the 'hockey' branch

jobs:
  deploy:
    name: Build and Deploy to Hostpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build  # This automatically generates the inner 'out' folder

      # === NEW STEP: PACKS AND SAVES THE OUT FOLDER FOR YOU TO DOWNLOAD ===
      - name: Save Out Folder for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: hockey-out-folder
          path: ./out/

      - name: Deploy via FTP to Hostpoint
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTPOINT_HOCKEY_FTP_SERVER }}
          username: ${{ secrets.HOSTPOINT_HOCKEY_FTP_USER }}
          password: ${{ secrets.HOSTPOINT_HOCKEY_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./www/3stepshockey.ch/
          protocol: ftps   
          dangerous-clean-slate: true  # Changed to false for safety while we test manually
