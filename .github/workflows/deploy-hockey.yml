name: Deploy Hockey Branch to Hostpoint

on:
  push:
    branches:
      - hockey

jobs:
  deploy:
    name: Build and Deploy to Hostpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Save Out Folder for Manual Download
        uses: actions/upload-artifact@v4
        with:
          name: hockey-out-folder
          path: ./out/
